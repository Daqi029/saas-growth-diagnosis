name: Skill bug
description: Report reproducible behavior that conflicts with the documented skill contract
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include client identities, private analytics, recordings, screenshots, credentials, or proprietary code. Use synthetic examples."
  - type: textarea
    id: request
    attributes:
      label: Synthetic request
      description: Reproduce the problem with fictional or anonymized inputs.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no confidential client or personal information.
          required: true
